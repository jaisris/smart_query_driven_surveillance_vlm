pipeline:
  frame_skip: 15         # process every Nth frame (e.g. 15 → ~2fps from 30fps source)
  batch_size: 32         # frames per CLIP batch encode
  cache_dir: ".cache"
  max_indexed_frames: 4000     # long videos auto-raise frame_skip so at most this many frames are indexed
  skip_static_frames: true     # skip CLIP encoding for near-duplicate consecutive frames
  static_diff_threshold: 0.3   # % of thumbnail pixels that must change for a frame to count as non-static

video:
  max_resolution: [1280, 720]   # resize frames if larger (w, h)

yolo:
  model: "yolov8n.pt"          # nano for speed; swap to yolov8m.pt for accuracy
  confidence_threshold: 0.4
  iou_threshold: 0.45
  class_whitelist: [0, 2, 3, 5, 7]   # COCO ids: person, car, motorcycle, bus, truck
  device: "auto"                # "auto" | "cpu" | "cuda"
  open_vocab_model: "yolov8s-worldv2.pt"   # YOLO-World v2 for query-aware boxes on result frames

tracking:
  # "bytetrack" | "botsort"  → YOLO.predict() detection + our own greedy IOU linker
  #                            (models/ultralytics_tracker.py). NOT Ultralytics' built-in
  #                            persist=True tracking: that mode was found to silently drop
  #                            most new-object detections once sampled frames are more than
  #                            ~0.3s apart (the norm once adaptive frame skip kicks in on
  #                            long videos), so it is deliberately not used. Both config
  #                            values currently behave identically.
  # "deepsort"               → original DeepSORT baseline (separate YOLO detect + re-ID tracker)
  backend: "bytetrack"

deepsort:
  max_age: 30          # frames before a lost track is deleted
  n_init: 3            # frames before a tentative track is confirmed
  max_iou_distance: 0.7
  max_cosine_distance: 0.3
  nn_budget: 100

clip:
  # Retrieval encoder — either family works, cache auto-invalidates on change:
  #   "openai/clip-vit-base-patch32"        CLIP baseline, 512-d, fastest
  #   "google/siglip2-base-patch16-224"     SigLIP 2 (2025), 768-d, better zero-shot retrieval
  model_name: "openai/clip-vit-base-patch32"
  device: "auto"
  query_prefix: "a photo of"   # prepended to text queries for better alignment

retrieval:
  top_k: 10
  gap_threshold_sec: 2.0       # merge segments closer than this
  min_segment_duration_sec: 1.0
  query_aware_detection: true  # run YOLO-World with the user's query terms on result frames

anomaly:
  enable_rule_based: true
  enable_vadclip: false        # set true once VadCLIP weights are downloaded
  vadclip_weights: "weights/vadclip_ucf.pth"

  loitering:
    dwell_radius_px: 80        # spatial radius to consider "staying in place"
    dwell_time_sec: 15.0       # how long before flagging as loitering (15.0 for the short viva demo
                                # clips below 3 min, e.g. data/videos/demo_real_theft.mp4 where the
                                # suspect's real dwell is ~28.8s; report Table 16 used 30.0 for the
                                # 45-min MEVA video)
    person_only: true          # only flag "person" class tracks (avoids parked-car false positives)

  intrusion:
    # List of forbidden zones as pixel-coordinate polygons.
    # Each zone is a list of [x, y] points.
    # Example: roi_zones: [[[100,100],[400,100],[400,300],[100,300]]]
    roi_zones: []

evaluation:
  iou_threshold: 0.5           # for mAP computation
  dataset_root: "data/datasets"
  ucf_crime_root: "data/datasets/UCF_Crimes"
  mot17_root: "data/datasets/MOT17"
